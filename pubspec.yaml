name: burhan_ai
description: A local offline AI assistant built with Flutter.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # مكتبات أساسية ومستقرة (تم تحديث إصداراتها لتناسب Flutter الحديث)
  shared_preferences: ^2.3.2
  sqflite: ^2.3.3+1
  path: ^1.9.0
  cupertino_icons: ^1.0.8

  # ⚠️ تأجيل إضافة مكتبات الملفات والـ PDF حتى نصل لخطوة كتابة الكود الخاص بها
  # file_picker: ^8.0.0
  # syncfusion_flutter_pdf: ^27.1.48

flutter:
  uses-material-design: true